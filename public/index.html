<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano-code</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1b1e; --surface: #25262b; --border: #373a40;
    --text: #c1c2c5; --text-dim: #909296; --text-muted: #5c5f66;
    --accent: #4c9aff; --accent-bg: rgba(76,154,255,0.08);
    --success: #51cf66; --error: #ff6b6b; --warning: #fcc419;
  }
  body { font: 14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ── */
  header { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.connected { background: var(--success); }
  .dot.connecting { background: var(--warning); animation: pulse 1s infinite; }
  .dot.disconnected { background: var(--error); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #status-text { color: var(--text-dim); font-size: 12px; flex: 1; }
  #cancel-btn { padding: 4px 14px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-dim); cursor: pointer; display: none; }
  #cancel-btn:hover { background: rgba(255,107,107,0.1); border-color: var(--error); color: var(--error); }

  /* ── Mode indicator ── */
  #mode-indicator { display: none; font-size: 12px; font-weight: 600; margin-left: auto; margin-right: 8px; cursor: pointer; user-select: none; padding: 2px 8px; border-radius: 4px; }
  #mode-indicator.show { display: inline; }
  #mode-indicator.plan { color: #fbbf24; }
  #mode-indicator.plan:hover { background: rgba(251,191,36,0.12); }

  /* ── Welcome placeholder ── */
  #welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; color: var(--text-muted); user-select: none; }
  #welcome.hidden { display: none; }
  #welcome .logo { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -1px; opacity: 0.15; }
  #welcome .hint { font-size: 13px; text-align: center; line-height: 1.8; }

  /* ── Messages ── */
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  #messages.show { display: flex; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 8px; line-height: 1.65; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent-bg); border: 1px solid rgba(76,154,255,0.15); white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; }
  .msg.system { align-self: center; color: var(--text-dim); font-size: 13px; background: transparent; border: none; padding: 6px; text-align: center; }
  .msg.error { align-self: flex-start; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); color: var(--error); }

  /* ── Tool call cards ── */
  .tool-card { align-self: flex-start; width: 100%; max-width: 640px; border-radius: 8px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); overflow: hidden; flex-shrink: 0; }
  .tool-card.success { border-left-color: var(--success); }
  .tool-card.error { border-left-color: var(--error); }
  .tool-card.rejected { border-left-color: var(--warning); }
  .tool-card-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
  .tool-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  .tool-card.success .tool-spinner { border-color: var(--success); animation: none; }
  .tool-card.success .tool-spinner::after { content: "✓"; display: block; font-size: 11px; line-height: 13px; text-align: center; color: var(--success); }
  .tool-card.error .tool-spinner { border-color: var(--error); animation: none; }
  .tool-card.error .tool-spinner::after { content: "✕"; display: block; font-size: 11px; line-height: 13px; text-align: center; color: var(--error); }
  .tool-card.rejected .tool-spinner { border-color: var(--warning); animation: none; }
  .tool-card.rejected .tool-spinner::after { content: "!"; display: block; font-size: 12px; line-height: 14px; text-align: center; color: var(--warning); font-weight: 700; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-card-header { cursor: pointer; user-select: none; }
  .tool-name { font-weight: 600; flex: 1; }
  .tool-args-preview { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
  .tool-status { font-size: 12px; color: var(--text-dim); }
  .tool-arrow { font-size: 10px; color: var(--text-muted); margin-left: auto; }
  .tool-detail { display: none; }
  .tool-detail.open { display: block; }
  .tool-section { border-top: 1px solid var(--border); }
  .tool-section-label { padding: 4px 12px 2px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; background: rgba(255,255,255,0.02); }
  .tool-section-content { padding: 6px 12px 8px; margin: 0; font-size: 12px; font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; white-space: pre-wrap; word-break: break-word; color: var(--text-dim); background: transparent; border: none; }

  /* ── 授权确认卡片 ── */
  .confirm-card { align-self: flex-start; width: 100%; max-width: 640px; border-radius: 8px; border: 1px solid var(--warning); border-left: 3px solid var(--warning); background: var(--surface); overflow: hidden; flex-shrink: 0; }
  .confirm-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; background: rgba(252,196,25,0.06); border-bottom: 1px solid var(--border); }
  .confirm-icon { font-size: 15px; }
  .confirm-title { font-weight: 600; flex: 1; color: var(--warning); }
  .confirm-tool { padding: 4px 12px; font-size: 13px; color: var(--text-dim); }
  .confirm-message { padding: 4px 12px 8px; font-size: 14px; color: var(--text); white-space: pre-wrap; }
  .confirm-details { padding: 4px 12px 8px; font-size: 12px; color: var(--text-muted); font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; white-space: pre-wrap; word-break: break-word; }
  .confirm-buttons { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); justify-content: flex-end; }
  .confirm-btn { padding: 6px 20px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; border: none; }
  .confirm-btn.allow { background: var(--success); color: #fff; }
  .confirm-btn.allow:hover { filter: brightness(1.1); }
  .confirm-btn.deny { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .confirm-btn.deny:hover { border-color: var(--error); color: var(--error); }

  /* ── Markdown 内容 ── */
  .msg.assistant p { margin: 6px 0; }
  .msg.assistant p:first-child { margin-top: 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 20px; }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { margin: 12px 0 6px; color: var(--text); font-weight: 600; }
  .msg.assistant h1 { font-size: 16px; }
  .msg.assistant h2 { font-size: 15px; }
  .msg.assistant h3, .msg.assistant h4 { font-size: 14px; }
  .msg.assistant table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg.assistant th { background: rgba(255,255,255,0.04); font-weight: 600; }
  .msg.assistant tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  .msg.assistant pre { background: #151618; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; }
  .msg.assistant pre code { background: none; padding: 0; border-radius: 0; font-size: 13px; color: var(--text); }
  .msg.assistant code { background: rgba(255,255,255,0.06); padding: 2px 5px; border-radius: 4px; font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size: 13px; }
  .msg.assistant blockquote { margin: 6px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--text-dim); }
  .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .msg.assistant a { color: var(--accent); text-decoration: none; }
  .msg.assistant a:hover { text-decoration: underline; }
  /* 流式中间态表格保护：不完整表格显示为等宽纯文本 */
  .msg.assistant .table-pending { display: block; font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size: 13px; color: var(--text-dim); white-space: pre; margin: 6px 0; }

  /* ── Thinking indicator ── */
  #thinking { display: none; align-items: center; gap: 8px; padding: 8px 12px; color: var(--text-dim); font-size: 13px; align-self: flex-start; margin-left: 20px; }
  #thinking.show { display: flex; }
  #thinking .label { color: var(--text-muted); }
  .think-dots { display: flex; gap: 4px; }
  .think-dots span { width: 5px; height: 5px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite both; }
  .think-dots span:nth-child(2) { animation-delay: 0.16s; }
  .think-dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

  /* ── Agent turn badge ── */
  .agent-badge { align-self: center; padding: 2px 10px; border-radius: 10px; font-size: 11px; background: var(--accent-bg); border: 1px solid rgba(76,154,255,0.2); color: var(--accent); }

  /* ── Question dialog overlay ── */
  #qd-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
  #qd-overlay.show { display: flex; }
  #qd-dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  #qd-header { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; font-size: 14px; }
  #qd-header .icon { font-size: 16px; }
  #qd-header .title { font-weight: 600; color: var(--warning); }
  #qd-header .progress { color: var(--text-muted); font-size: 12px; margin-left: auto; }
  #qd-question { padding: 10px 18px 6px; font-size: 14px; color: var(--text); line-height: 1.6; }
  #qd-options { padding: 6px 18px 8px; }
  .qd-opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-top: 4px; border: 1px solid transparent; }
  .qd-opt:hover { background: rgba(255,255,255,0.04); }
  .qd-opt.focused { background: rgba(76,154,255,0.1); border-color: var(--accent); }
  .qd-opt .indicator { flex-shrink: 0; font-size: 15px; width: 20px; text-align: center; color: var(--text-dim); }
  .qd-opt.focused .indicator { color: var(--accent); }
  .qd-opt.selected .indicator { color: var(--accent); }
  .qd-opt .label { flex: 1; font-size: 14px; color: var(--text); }
  .qd-opt.focused .label { color: #fff; }
  .qd-opt.other .indicator { color: var(--text-muted); }
  #qd-desc { padding: 0 18px 6px; font-size: 12px; color: var(--text-muted); min-height: 20px; }
  #qd-hint { padding: 0 18px 14px; font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  /* custom input screen */
  #qd-custom-area { display: none; padding: 8px 18px 14px; }
  #qd-custom-area.show { display: block; }
  #qd-custom-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; outline: none; resize: none; min-height: 40px; }
  #qd-custom-input:focus { border-color: var(--accent); }
  #qd-custom-hint { display: none; padding: 0 18px 14px; font-size: 11px; color: var(--text-muted); }
  #qd-custom-hint.show { display: block; }
  /* confirm screen */
  #qd-confirm-area { display: none; padding: 8px 18px 14px; }
  #qd-confirm-area.show { display: block; }
  .qd-confirm-item { padding: 6px 0; }
  .qd-confirm-item .q { font-size: 13px; color: var(--text-dim); }
  .qd-confirm-item .a { font-size: 14px; color: var(--accent); padding-left: 12px; margin-top: 2px; }
  /* dialog footer */
  #qd-footer { display: flex; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--border); justify-content: flex-end; }
  .qd-btn { padding: 6px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; border: none; }
  .qd-btn.primary { background: var(--accent); color: #fff; }
  .qd-btn.primary:hover { filter: brightness(1.08); }
  .qd-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .qd-btn.secondary:hover { border-color: var(--text-dim); color: var(--text); }
  .qd-btn.danger { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .qd-btn.danger:hover { border-color: var(--error); color: var(--error); }

  /* ── Background task display ── */
  #bg-tasks { display: none; gap: 4px 12px; padding: 4px 20px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-dim); flex-shrink: 0; flex-wrap: wrap; }
  #bg-tasks.show { display: flex; }
  .bg-task { display: inline-flex; align-items: center; gap: 4px; }
  .bg-task .dot { width: 6px; height: 6px; border-radius: 50%; }
  .bg-task .dot.running { background: var(--accent); animation: pulse 1s infinite; }
  .bg-task .dot.completed { background: var(--success); }
  .bg-task .dot.error { background: var(--error); }

  /* ── Status bar ── */
  #status-bar { display: none; flex-wrap: wrap; gap: 4px 12px; padding: 4px 20px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
  #status-bar.show { display: flex; }
  .status-seg { display: inline-flex; align-items: center; gap: 4px; }

  /* ── Input area ── */
  #input-area { display: flex; gap: 8px; padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; }
  #input::placeholder { color: var(--text-muted); }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: 0.35; }
  #send-btn { padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; font-weight: 500; }
  #send-btn:disabled { opacity: 0.35; cursor: default; }
  #send-btn:hover:not(:disabled) { filter: brightness(1.08); }
</style>
</head>
<body>

<header>
  <h1>nano-code</h1>
  <span class="dot connecting" id="status-dot"></span>
  <span id="status-text">Connecting...</span>
  <span id="mode-indicator" onclick="toggleMode()"></span>
  <button id="cancel-btn" onclick="sendCancel()">Cancel</button>
</header>

<div id="welcome">
  <div class="logo">nano-code</div>
  <div class="hint">Connected &middot; waiting for input<br>Type a message to start</div>
</div>

<div id="bg-tasks"></div>
<div id="status-bar"></div>
<div id="messages"></div>
<div id="thinking"><span class="label">Thinking</span><div class="think-dots"><span></span><span></span><span></span></div></div>

<!-- ── Question dialog overlay ── -->
<div id="qd-overlay">
  <div id="qd-dialog">
    <div id="qd-header">
      <span class="icon">❓</span>
      <span class="title" id="qd-header-title">Question</span>
      <span class="progress" id="qd-progress"></span>
    </div>
    <div id="qd-question"></div>
    <div id="qd-options"></div>
    <div id="qd-desc"></div>
    <div id="qd-hint"></div>
    <div id="qd-custom-area">
      <textarea id="qd-custom-input" rows="2" placeholder="输入自定义文本..."></textarea>
    </div>
    <div id="qd-custom-hint">Enter 确认 · Esc 返回</div>
    <div id="qd-confirm-area"></div>
    <div id="qd-footer">
      <button class="qd-btn danger" id="qd-cancel" onclick="qdCancel()">Cancel</button>
      <button class="qd-btn secondary" id="qd-back" onclick="qdBack()" style="display:none">Back</button>
      <button class="qd-btn primary" id="qd-next" onclick="qdNext()">Next</button>
      <button class="qd-btn primary" id="qd-submit" onclick="qdSubmit()" style="display:none">Submit</button>
    </div>
  </div>
</div>

<div id="input-area">
  <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" disabled></textarea>
  <button id="send-btn" disabled onclick="sendInput()">Send</button>
</div>

<script>
// ── State ──
const state = { currentMsg: null, currentRawText: '', renderTimer: null, toolCards: new Map(), connected: false, es: null, showThink: false, debug: false, toolDefinitions: [] };

const $ = id => document.getElementById(id);
const msgArea = $('messages');
const welcomeEl = $('welcome');
const inputEl = $('input');
const sendBtn = $('send-btn');
const cancelBtn = $('cancel-btn');
const statusDot = $('status-dot');
const statusText = $('status-text');
const thinkingEl = $('thinking');

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function scrollBottom() { msgArea.scrollTop = msgArea.scrollHeight; }

// ── Markdown 渲染（惰性初始化，CDN defer 加载完成后可用） ──
let _md = null;
function getMd() {
  if (!_md && window.markdownit) {
    _md = window.markdownit({
      html: false, breaks: true, linkify: false,
      highlight(str, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return '<pre><code class="hljs">' + hljs.highlight(str, { language: lang, ignoreIllegals: true }).value + '</code></pre>';
          } catch {}
        }
        return '<pre><code class="hljs">' + _md.utils.escapeHtml(str) + '</code></pre>';
      },
    });
  }
  return _md;
}

function renderMarkdown(text) {
  if (!text) return '';
  const m = getMd();
  if (!m || !window.DOMPurify) return escapeHtml(text.replace(/\n+$/, ''));
  return DOMPurify.sanitize(m.render(text)).replace(/\n+$/, '');
}

function scheduleRender() {
  if (state.renderTimer) clearTimeout(state.renderTimer);
  state.renderTimer = setTimeout(doRender, 150);
}

function doRender() {
  state.renderTimer = null;
  if (!state.currentMsg || !state.currentRawText) return;
  state.currentMsg.innerHTML = renderStreaming(state.currentRawText);
  scrollBottom();
}

function renderImmediate() {
  if (state.renderTimer) { clearTimeout(state.renderTimer); state.renderTimer = null; }
  doRender();
}

// 流式渲染：表格未完整时不渲染 Markdown，仅显示为纯文本
function renderStreaming(text) {
  if (!text) return '';
  const info = findIncompleteTable(text);
  if (info) {
    const m = getMd();
    const beforeHtml = m && window.DOMPurify
      ? DOMPurify.sanitize(m.render(info.before))
      : escapeHtml(info.before);
    return beforeHtml + '<div class="table-pending">' + escapeHtml(info.tablePart) + '</div>';
  }
  return renderMarkdown(text);
}

// 检测文本末尾是否有不完整表格（最后一行以 | 开头但未闭合，如 `| 核心源码 | 642`）
function findIncompleteTable(text) {
  if (!/^\|[-:| ]+\|$/m.test(text)) return null;
  const lines = text.split('\n');
  let i = lines.length;
  while (i--) { if (lines[i].trim()) break; }
  if (i < 0) return null;
  const trimmed = lines[i].trim();
  // 不以 | 开头 → 不是表格；以 | 开头且以 | 结尾 → 完整行，正常渲染
  if (!trimmed.startsWith('|') || trimmed.endsWith('|')) return null;
  // 最后一行以 | 开头但未闭合 → 扫描前面的完整 | 行
  while (i >= 0 && lines[i].trim().startsWith('|')) i--;
  const before = lines.slice(0, i + 1).join('\n');
  const tablePart = lines.slice(i + 1).join('\n');
  if (!/^\|[-:| ]+\|$/m.test(tablePart)) return null;
  return { before, tablePart };
}

function toggleToolDetail(card) {
  const detail = card.querySelector('.tool-detail');
  const arrow = card.querySelector('.tool-arrow');
  if (!detail) return;
  const open = detail.classList.toggle('open');
  arrow.textContent = open ? '▾' : '▸';
}

function addMsg(className, html) {
  welcomeEl.classList.add('hidden');
  msgArea.classList.add('show');
  const el = document.createElement('div');
  el.className = 'msg ' + className;
  el.innerHTML = html;
  msgArea.appendChild(el);
  scrollBottom();
  return el;
}

function setStatus(stateClass, text) {
  statusDot.className = 'dot ' + stateClass;
  statusText.textContent = text;
}

// ── Mode indicator ──
const modeEl = $('mode-indicator');
function updateMode(segments) {
  const modeText = (segments?.mode || '').toLowerCase();
  const isPlan = modeText.includes('plan');
  if (isPlan) {
    modeEl.className = 'show plan';
    modeEl.textContent = '● PLAN (shift+tab)';
    modeEl.title = 'Click or Shift+Tab to switch to normal mode';
  } else {
    modeEl.className = '';
  }
}
async function toggleMode() {
  try { await fetch('/mode-toggle', { method: 'POST', body: '{}' }); } catch {}
}

// ── Question dialog state machine ──
const qd = {
  questions: [],
  currentIdx: 0,
  focusIdx: 0,
  screen: 'selecting', // 'selecting' | 'customInput' | 'confirming'
  selections: {},
  customInputs: {},
  customText: '',
  dialogId: '',
  multiSelect: false,
};

function qdOpen(data) {
  qd.questions = data.questions || [];
  qd.currentIdx = 0;
  qd.focusIdx = 0;
  qd.screen = 'selecting';
  qd.selections = {};
  qd.customInputs = {};
  qd.customText = '';
  qd.dialogId = data.id || '';
  qd.multiSelect = false;
  for (const q of qd.questions) qd.selections[q.question] = [];
  $('qd-overlay').classList.add('show');
  qdRender();
  // 将 QD state 暴露给全局
  window._qd = qd;
}

function qdClose() {
  $('qd-overlay').classList.remove('show');
}

function qdRender() {
  const overlay = $('qd-overlay');
  if (!overlay.classList.contains('show')) return;
  // Reset visibility
  $('qd-options').style.display = 'none';
  $('qd-desc').style.display = 'none';
  $('qd-hint').style.display = 'none';
  $('qd-custom-area').classList.remove('show');
  $('qd-custom-hint').classList.remove('show');
  $('qd-confirm-area').classList.remove('show');
  $('qd-back').style.display = 'none';
  $('qd-next').style.display = 'none';
  $('qd-submit').style.display = 'none';
  $('qd-cancel').style.display = '';

  if (qd.screen === 'selecting') {
    qdRenderSelecting();
  } else if (qd.screen === 'customInput') {
    qdRenderCustomInput();
  } else if (qd.screen === 'confirming') {
    qdRenderConfirming();
  }
}

function qdRenderSelecting() {
  const q = qd.questions[qd.currentIdx];
  if (!q) return;
  const allOptions = [...q.options, { label: '其它 (自定义输入)', description: '输入自定义文本' }];
  $('qd-header-title').textContent = '❓ ' + q.header;
  $('qd-progress').textContent = '(' + (qd.currentIdx + 1) + '/' + qd.questions.length + ')';
  $('qd-question').textContent = q.question;
  const sel = qd.selections[q.question] || [];

  // Render options
  const optsEl = $('qd-options');
  optsEl.style.display = '';
  optsEl.innerHTML = '';
  for (let i = 0; i < allOptions.length; i++) {
    const opt = allOptions[i];
    const isFocused = i === qd.focusIdx;
    const isSelected = sel.includes(opt.label);
    const isOther = opt.label === '其它 (自定义输入)';
    const div = document.createElement('div');
    div.className = 'qd-opt' + (isFocused ? ' focused' : '') + (isSelected ? ' selected' : '') + (isOther ? ' other' : '');
    div.dataset.idx = i;
    div.innerHTML = '<span class="indicator">' + (isOther ? (isSelected ? '✎' : '✎') : q.multiSelect ? (isSelected ? '☑' : '☐') : isFocused ? '◉' : '○') + '</span><span class="label">' + escapeHtml(opt.label) + '</span>';
    div.onclick = () => { qd.focusIdx = i; qdSelectOption(); };
    div.onmouseenter = () => { qd.focusIdx = i; qdRender(); };
    optsEl.appendChild(div);
  }

  // Description
  $('qd-desc').style.display = '';
  $('qd-desc').textContent = allOptions[qd.focusIdx]?.description || '';

  // Hints
  $('qd-hint').style.display = '';
  $('qd-hint').textContent = q.multiSelect
    ? '↑↓ 选择  Space 切换  ←→ 切换问题  Enter 确认  Esc 取消'
    : '↑↓ 选择  Enter 确认  ←→ 切换问题  Esc 取消';

  // Footer buttons
  $('qd-cancel').style.display = '';
  if (qd.currentIdx < qd.questions.length - 1) {
    const selCur = qd.selections[qd.questions[qd.currentIdx].question] || [];
    if (selCur.length > 0) {
      $('qd-next').style.display = '';
      $('qd-next').textContent = 'Next →';
    }
  } else {
    const allAnswered = qd.questions.every(q2 => (qd.selections[q2.question] || []).length > 0);
    if (allAnswered) {
      $('qd-next').style.display = '';
      $('qd-next').textContent = 'Review';
    }
  }
}

function qdRenderCustomInput() {
  const q = qd.questions[qd.currentIdx];
  $('qd-header-title').textContent = '✎ ' + q.header + ' - 自定义输入';
  $('qd-progress').textContent = '';
  $('qd-question').textContent = q.question;

  $('qd-custom-area').classList.add('show');
  $('qd-custom-hint').classList.add('show');
  const input = $('qd-custom-input');
  input.value = qd.customText;
  setTimeout(() => input.focus(), 50);

  $('qd-cancel').textContent = 'Back';
}

function qdRenderConfirming() {
  $('qd-header-title').innerHTML = '✓ 确认你的回答';
  $('qd-progress').textContent = '';
  $('qd-question').style.display = 'none';

  const area = $('qd-confirm-area');
  area.classList.add('show');
  area.innerHTML = '';
  for (const q of qd.questions) {
    const sel = qd.selections[q.question] || [];
    const hasOther = sel.includes('其它 (自定义输入)');
    const custom = qd.customInputs[q.question] || '';
    const normalSel = sel.filter(s => s !== '其它 (自定义输入)');
    const display = hasOther && custom ? escapeHtml(custom) : escapeHtml(normalSel.join(', ') || (hasOther ? '(空)' : '(未选择)'));
    const item = document.createElement('div');
    item.className = 'qd-confirm-item';
    item.innerHTML = '<div class="q">[' + escapeHtml(q.header) + '] ' + escapeHtml(q.question) + '</div><div class="a">→ ' + display + '</div>';
    area.appendChild(item);
  }

  $('qd-cancel').style.display = '';
  $('qd-back').style.display = '';
  $('qd-submit').style.display = '';
}

function qdSelectOption() {
  const q = qd.questions[qd.currentIdx];
  const allOptions = [...q.options, { label: '其它 (自定义输入)', description: '' }];
  const opt = allOptions[qd.focusIdx];
  const isOther = opt.label === '其它 (自定义输入)';

  if (q.multiSelect) {
    const prev = [...(qd.selections[q.question] || [])];
    const idx = prev.indexOf(opt.label);
    if (idx >= 0) prev.splice(idx, 1);
    else prev.push(opt.label);
    qd.selections[q.question] = prev;
    qdRender();
    return;
  }

  // Single select
  if (isOther) {
    qd.selections[q.question] = ['其它 (自定义输入)'];
    qd.customText = qd.customInputs[q.question] || '';
    qd.screen = 'customInput';
    qdRender();
    return;
  }
  qd.selections[q.question] = [opt.label];
  qdAdvance();
}

function qdAdvance() {
  if (qd.currentIdx < qd.questions.length - 1) {
    // Check if current has "其它" selected and needs custom input
    const sel = qd.selections[qd.questions[qd.currentIdx].question] || [];
    if (sel.includes('其它 (自定义输入)')) {
      qd.customText = qd.customInputs[qd.questions[qd.currentIdx].question] || '';
      qd.screen = 'customInput';
      qdRender();
      return;
    }
    qd.currentIdx++;
    qd.focusIdx = 0;
    qdRender();
  } else {
    const allAnswered = qd.questions.every(q2 => (qd.selections[q2.question] || []).length > 0);
    if (allAnswered) {
      qd.screen = 'confirming';
      qdRender();
    }
  }
}

function qdNext() {
  if (qd.screen === 'confirming') { qdSubmit(); return; }
  const q = qd.questions[qd.currentIdx];
  const sel = qd.selections[q.question] || [];
  if (sel.includes('其它 (自定义输入)')) {
    qd.customText = qd.customInputs[q.question] || '';
    qd.screen = 'customInput';
    qdRender();
    return;
  }
  qdAdvance();
}

function qdBack() {
  if (qd.screen === 'confirming') {
    qd.screen = 'selecting';
    qd.currentIdx = qd.questions.length - 1;
    qd.focusIdx = 0;
    qdRender();
  }
}

function qdCancel() {
  if (qd.screen === 'customInput') {
    qd.screen = 'selecting';
    qdRender();
    return;
  }
  // Cancel entire dialog
  if (qd.dialogId) {
    fetch('/question-answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: qd.dialogId, answers: {} }) }).catch(() => {});
  }
  qdClose();
}

function qdSubmit() {
  const answers = {};
  for (const q of qd.questions) {
    const sel = qd.selections[q.question] || [];
    if (sel.includes('其它 (自定义输入)')) {
      answers[q.question] = qd.customInputs[q.question] || '';
    } else {
      answers[q.question] = sel.join(', ');
    }
  }
  if (qd.dialogId) {
    fetch('/question-answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: qd.dialogId, answers }) }).catch(() => {});
  }
  qdClose();
}

// Keyboard handler for question dialog
document.addEventListener('keydown', (e) => {
  const overlay = $('qd-overlay');
  if (!overlay.classList.contains('show')) return;
  if (qd.screen === 'customInput' && document.activeElement === $('qd-custom-input')) {
    if (e.key === 'Escape') { e.preventDefault(); qdCancel(); return; }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const q = qd.questions[qd.currentIdx];
      qd.customInputs[q.question] = $('qd-custom-input').value;
      qd.customText = '';
      qd.screen = 'selecting';
      // Check if all answered and last question
      const allAnswered = qd.questions.every(q2 => (qd.selections[q2.question] || []).length > 0);
      if (allAnswered && qd.currentIdx === qd.questions.length - 1) {
        qd.screen = 'confirming';
      }
      qdRender();
      return;
    }
    return; // Let normal typing happen
  }
  if (e.key === 'Escape') { e.preventDefault(); qdCancel(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); qd.focusIdx = Math.min(qd.questions[qd.currentIdx].options.length, qd.focusIdx + 1); qdRender(); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); qd.focusIdx = Math.max(0, qd.focusIdx - 1); qdRender(); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (qd.currentIdx > 0) { qd.currentIdx--; qd.focusIdx = 0; qdRender(); } return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (qd.currentIdx < qd.questions.length - 1) { const q = qd.questions[qd.currentIdx]; const sel = qd.selections[q.question] || []; if (sel.length > 0) { qd.currentIdx++; qd.focusIdx = 0; qdRender(); } } return; }
  if (e.key === 'Enter') { e.preventDefault(); qdSelectOption(); return; }
  if (e.key === ' ') { e.preventDefault(); qdSelectOption(); return; }
});

function setInputEnabled(en) {
  inputEl.disabled = !en;
  sendBtn.disabled = !en;
  if (en) setTimeout(() => inputEl.focus(), 100);
}

function showThinking(show) { thinkingEl.classList.toggle('show', show); }

let isProcessing = false;
function setProcessing(p) {
  isProcessing = p;
  cancelBtn.style.display = p ? 'block' : 'none';
}

// ── SSE connection ──
function connect() {
  if (state.es) state.es.close();
  const es = new EventSource('/events');
  state.es = es;

  es.addEventListener('session:start', (e) => {
    const d = JSON.parse(e.data);
    msgArea.innerHTML = '';
    msgArea.classList.remove('show');
    welcomeEl.classList.remove('hidden');
    state.currentMsg = null;
    state.currentRawText = '';
    if (state.renderTimer) { clearTimeout(state.renderTimer); state.renderTimer = null; }
    state.toolCards.clear();
    state.showThink = d.showThink === true;
    state.debug = d.debug === true;
    setStatus('connected', 'Ready');
    setInputEnabled(true);
    modeEl.className = '';
    $('bg-tasks').innerHTML = '';
    $('bg-tasks').classList.remove('show');
    $('status-bar').innerHTML = '';
    $('status-bar').classList.remove('show');
  });

  es.addEventListener('session:ready', () => {
    renderImmediate();
    setInputEnabled(true);
    setProcessing(false);
    showThinking(false);
    state.currentMsg = null;
  });

  es.addEventListener('session:stop', (e) => {
    const d = JSON.parse(e.data);
    addMsg('system', d.message || 'Session ended');
    setInputEnabled(false);
    setProcessing(false);
    showThinking(false);
    setStatus('disconnected', 'Ended');
    es.close();
  });

  es.addEventListener('stream:chunk', (e) => {
    const d = JSON.parse(e.data);
    if (!state.currentMsg) {
      if (!d.text.trim()) return;
      state.currentMsg = addMsg('assistant', '');
      state.currentRawText = '';
    }
    state.currentRawText += d.text;
    state.currentMsg.innerHTML = escapeHtml(state.currentRawText.replace(/\n+$/, ''));
    scrollBottom();
    // 代码块闭合检测（``` 成对出现时立即渲染高亮）
    const markers = state.currentRawText.match(/```/g);
    if (markers && markers.length % 2 === 0 && markers.length > 0) {
      renderImmediate();
    } else {
      scheduleRender();
    }
  });

  es.addEventListener('tool:call', (e) => {
    const d = JSON.parse(e.data);
    renderImmediate();
    state.currentMsg = null;
    welcomeEl.classList.add('hidden');
    msgArea.classList.add('show');
    const card = document.createElement('div');
    card.className = 'tool-card running';
    card.dataset.toolId = d.id;
    const toolName = d.displayName || d.toolName;
    const argsStr = d.args && Object.keys(d.args).length > 0 ? JSON.stringify(d.args, null, 2) : '';
    const argsPreview = d.argsPreview || '';
    card.innerHTML = `
      <div class="tool-card-header" onclick="toggleToolDetail(this.parentElement)">
        <div class="tool-spinner"></div>
        <span class="tool-name">${escapeHtml(toolName)}<span class="tool-args-preview">${escapeHtml(argsPreview)}</span></span>
        <span class="tool-status">running</span>
        <span class="tool-arrow">▸</span>
      </div>
      <div class="tool-detail">
        ${argsStr ? `<div class="tool-section"><div class="tool-section-label">Arguments</div><pre class="tool-section-content">${escapeHtml(argsStr)}</pre></div>` : ''}
        <div class="tool-section tool-result-section" style="display:none"><div class="tool-section-label">Result</div><pre class="tool-section-content tool-result-content"></pre></div>
      </div>`;
    msgArea.appendChild(card);
    state.toolCards.set(d.id, card);
    scrollBottom();
  });

  es.addEventListener('tool:result', (e) => {
    const d = JSON.parse(e.data);
    const card = state.toolCards.get(d.id);
    if (!card) return;
    card.classList.remove('running');
    card.classList.add(d.status === 'success' ? 'success' : d.status === 'error' ? 'error' : 'rejected');
    card.querySelector('.tool-status').textContent = d.status === 'success' ? 'ok' : d.status === 'error' ? (d.message || 'failed') : 'rejected';
    const sec = card.querySelector('.tool-result-section');
    const content = card.querySelector('.tool-result-content');
    if (sec && content) { sec.style.display = ''; content.textContent = d.message || d.status || ''; }
  });

  es.addEventListener('tool:definitions', (e) => {
    const d = JSON.parse(e.data);
    state.toolDefinitions = d.definitions || [];
  });

  es.addEventListener('status', (e) => {
    const d = JSON.parse(e.data);
    if (d.level === 'status' && d.message === 'thinking') { if (state.showThink) showThinking(true); setProcessing(true); }
    else if (d.level === 'status' && d.message === 'end') { renderImmediate(); showThinking(false); setProcessing(false); state.currentMsg = null; }
    else if (d.level === 'info' || d.level === 'warn') addMsg('system', d.message);
  });

  es.addEventListener('error', (e) => {
    const d = JSON.parse(e.data);
    addMsg('error', 'Error: ' + escapeHtml(d.message));
  });

  es.addEventListener('debug', (e) => {
    if (!state.debug) return;
    const d = JSON.parse(e.data);
    const data = typeof d.data === 'string' ? d.data : JSON.stringify(d.data, null, 2);
    const tag = d.agentName && d.agentName !== 'main' ? `[${escapeHtml(d.agentName)}] ` : '';
    addMsg('system', '[debug] ' + tag + escapeHtml(data));
  });

  es.addEventListener('agent:turn_start', (e) => {
    const d = JSON.parse(e.data);
    if (d.agentName !== 'main') addMsg('agent-badge', '&#9881; Agent: ' + escapeHtml(d.agentName));
  });

  es.addEventListener('agent:turn_end', () => { renderImmediate(); state.currentMsg = null; });

  es.addEventListener('confirmation:request', (e) => {
    const d = JSON.parse(e.data);
    msgArea.querySelectorAll('.confirm-card').forEach(el => el.remove());
    const card = document.createElement('div');
    card.className = 'confirm-card';
    card.dataset.confirmId = d.id;
    const toolLabel = escapeHtml(d.displayName || d.toolName);
    let diffHtml = '';
    if (d.diff && d.diff.length > 0) {
      diffHtml = '<div class="tool-section"><div class="tool-section-label">Diff</div><div class="tool-section-content">';
      for (const h of d.diff) {
        for (const l of h.lines || []) {
          const cl = l.type === 'add' ? 'color:#51cf66' : l.type === 'remove' ? 'color:#ff6b6b' : 'color:var(--text-muted)';
          const prefix = l.type === 'add' ? '+' : l.type === 'remove' ? '-' : ' ';
          diffHtml += `<span style="${cl}">${escapeHtml(prefix + l.content)}</span>\n`;
        }
      }
      diffHtml += '</div></div>';
    }
    const fileHtml = d.filePath ? `<div class="confirm-details">File: ${escapeHtml(d.filePath)}</div>` : '';
    card.innerHTML = `
      <div class="confirm-header"><span class="confirm-icon">⚠</span><span class="confirm-title">Authorization Required</span></div>
      <div class="confirm-tool">${toolLabel}</div>
      <div class="confirm-message">${escapeHtml(d.message)}</div>
      ${fileHtml}
      ${d.details ? `<div class="confirm-details">${escapeHtml(d.details)}</div>` : ''}
      ${diffHtml}
      <div class="confirm-buttons">
        <button class="confirm-btn deny">Deny</button>
        <button class="confirm-btn allow">Allow</button>
      </div>`;
    const allowBtn = card.querySelector('.allow');
    const denyBtn = card.querySelector('.deny');
    if (allowBtn) allowBtn.addEventListener('click', () => sendConfirm(d.id, true));
    if (denyBtn) denyBtn.addEventListener('click', () => sendConfirm(d.id, false));
    msgArea.appendChild(card);
    scrollBottom();
  });

  es.addEventListener('question:dialog', (e) => {
    const d = JSON.parse(e.data);
    qdOpen(d);
  });

  es.addEventListener('background:task', (e) => {
    const d = JSON.parse(e.data);
    const bar = $('bg-tasks');
    // Remove existing task with same id
    const existing = bar.querySelector(`[data-task-id="${d.taskId}"]`);
    if (existing) existing.remove();
    if (d.taskStatus === 'started') {
      const el = document.createElement('span');
      el.className = 'bg-task';
      el.dataset.taskId = d.taskId;
      el.innerHTML = `<span class="dot running"></span> ${escapeHtml(d.message || d.taskId)}`;
      bar.appendChild(el);
    } else if (d.taskStatus === 'completed' || d.taskStatus === 'error') {
      // Show briefly then remove
      const el = document.createElement('span');
      el.className = 'bg-task';
      el.dataset.taskId = d.taskId;
      el.innerHTML = `<span class="dot ${d.taskStatus}"></span> ${escapeHtml(d.message || d.taskId)}`;
      bar.appendChild(el);
      setTimeout(() => { const e2 = bar.querySelector(`[data-task-id="${d.taskId}"]`); if (e2) e2.remove(); bar.classList.toggle('show', bar.children.length > 0); }, 5000);
    }
    bar.classList.toggle('show', bar.children.length > 0);
  });

  es.addEventListener('status:bar', (e) => {
    const d = JSON.parse(e.data);
    const bar = $('status-bar');
    bar.innerHTML = '';
    if (d.segments && typeof d.segments === 'object') {
      let count = 0;
      for (const [key, value] of Object.entries(d.segments)) {
        if (key === 'mode') continue; // mode 单独显示在 header 中
        if (value) { bar.innerHTML += `<span class="status-seg">${escapeHtml(value)}</span>`; count++; }
      }
      bar.classList.toggle('show', count > 0);
    }
    updateMode(d.segments);
  });

  es.addEventListener('user:input', (e) => {
    const d = JSON.parse(e.data);
    renderImmediate();
    state.currentMsg = null;
    addMsg('user', escapeHtml(d.text));
  });

  es.onerror = () => { setStatus('disconnected', 'Reconnecting...'); state.connected = false; setInputEnabled(false); };
  es.onopen = () => { setStatus('connected', 'Connected'); state.connected = true; };
}

async function sendInput() {
  const text = inputEl.value;
  if (!text.trim()) return;
  inputEl.value = '';
  setInputEnabled(false);
  state.currentMsg = null;
  try {
    const r = await fetch('/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text.trim() }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (err) {
    addMsg('user', escapeHtml(text.trim()));
    addMsg('error', 'Failed to send: ' + err.message);
    setInputEnabled(true);
  }
}

async function sendCancel() { try { await fetch('/cancel', { method: 'POST', body: '{}' }); } catch {} }

async function sendConfirm(id, approved) {
  try { await fetch('/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, approved }) }); } catch {}
  const card = document.querySelector(`.confirm-card[data-confirm-id="${id}"]`);
  if (card) card.remove();
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && e.shiftKey) { e.preventDefault(); toggleMode(); return; }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendInput(); }
});
connect();
// CDN 库加载完成后重渲染当前消息（本地优先，CDN fallback 时的保险）
(function pollMdLibs() {
  if (window.markdownit && window.DOMPurify) {
    if (state.currentMsg && state.currentRawText) doRender();
    // hljs 延迟加载时再次触发以启用语法高亮
    if (window.hljs && state.currentMsg && state.currentRawText) doRender();
    return;
  }
  setTimeout(pollMdLibs, 300);
})();
