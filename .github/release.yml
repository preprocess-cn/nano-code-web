changelog:
  categories:
    - title: 新功能
      labels:
        - feat
        - enhancement
        - feature
    - title: 修复
      labels:
        - fix
        - bug
        - bugfix
    - title: CI/CD
      labels:
        - ci
        - ci/cd
    - title: 文档
      labels:
        - docs
        - documentation
    - title: 其他变更
      labels:
        - "*"
